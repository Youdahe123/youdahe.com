<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>talk to youdahe · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="/thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">home</a>
            <a href="experience.html">experience</a>
            <a href="projects.html">projects</a>
            <a href="photography.html">photography</a>
            <a href="contacts.html">talk to youdahe</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <main class="container">
        <section class="chat-section">
            <h1>Talk to Youdahe</h1>
            <p class="chat-intro">hey! ask me anything about my work, projects, or whatever you're curious about</p>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot-message">
                        <div class="message-content">
                            yo! what's up? ask me anything about my experience, projects, or just what i'm into these days
                        </div>
                    </div>
                </div>

                <div class="suggested-prompts" id="suggestedPrompts">
                    <button class="prompt-chip" data-prompt="what are you working on right now?">what are you working on right now?</button>
                    <button class="prompt-chip" data-prompt="tell me about your experience at Medica">tell me about your experience at Medica</button>
                    <button class="prompt-chip" data-prompt="what's docere?">what's docere?</button>
                    <button class="prompt-chip" data-prompt="what tech stack do you use the most?">what tech stack do you use the most?</button>
                    <button class="prompt-chip" data-prompt="what got you into coding?">what got you into coding?</button>
                </div>

                <div class="chat-input-container">
                    <input
                        type="text"
                        id="chatInput"
                        class="chat-input"
                        placeholder="type something..."
                        autocomplete="off"
                    >
                    <button id="sendButton" class="send-button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
