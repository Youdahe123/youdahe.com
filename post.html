<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="/thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">home</a>
            <a href="writing.html">writing</a>
            <a href="photography.html">photography</a>
            <a href="daily.html">daily log</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <main class="container writing-container">
        <article id="postContent">
            <p class="writing-loading">Loading...</p>
        </article>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="posts.js"></script>
    <script>
        (async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            const container = document.getElementById('postContent');

            if (!id) {
                window.location.href = 'writing.html';
                return;
            }

            const post = await getPost(id);

            if (!post) {
                container.innerHTML = '<p>Post not found.</p><a href="writing.html" class="post-back">back to writing</a>';
                return;
            }

            document.title = `${post.title} · youdahe.com`;
            const body = renderPostContent(post.content);
            const likeCount = await getLikes(id);
            const liked = localStorage.getItem(`liked_${id}`) === 'true';

            container.innerHTML = `
                <a href="writing.html" class="post-back">back</a>
                <span class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                <h1 class="post-full-title">${post.title}</h1>
                <div class="post-body">${body}</div>

                <div class="post-actions">
                    <button class="like-btn ${liked ? 'liked' : ''}" id="likeBtn" onclick="handleLike('${id}')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="${liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span id="likeCount">${likeCount}</span>
                    </button>
                </div>

                <div class="comments-section">
                    <h3 class="comments-title">Comments</h3>
                    <div id="commentsList" class="comments-list"></div>
                    <form class="comment-form" onsubmit="handleComment(event, '${id}')">
                        <input type="text" id="commentName" class="comment-input" placeholder="Your name" required>
                        <textarea id="commentText" class="comment-textarea" placeholder="Leave a comment..." required></textarea>
                        <button type="submit" class="admin-btn">post comment</button>
                    </form>
                </div>
            `;

            loadComments(id);
        })();

        async function handleLike(postId) {
            if (localStorage.getItem(`liked_${postId}`) === 'true') return;
            localStorage.setItem(`liked_${postId}`, 'true');
            const count = await likePost(postId);
            document.getElementById('likeCount').textContent = count;
            const btn = document.getElementById('likeBtn');
            btn.classList.add('liked');
            btn.querySelector('svg').setAttribute('fill', 'currentColor');
        }

        async function loadComments(postId) {
            const comments = await getComments(postId);
            const list = document.getElementById('commentsList');

            if (comments.length === 0) {
                list.innerHTML = '<p class="comments-empty">No comments yet.</p>';
                return;
            }

            list.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-header">
                        <strong class="comment-name">${c.name}</strong>
                        <span class="comment-date">${new Date(c.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                    </div>
                    <p class="comment-text">${c.text}</p>
                </div>
            `).join('');
        }

        async function handleComment(e, postId) {
            e.preventDefault();
            const name = document.getElementById('commentName').value.trim();
            const text = document.getElementById('commentText').value.trim();
            if (!name || !text) return;

            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'posting...';

            await addComment(postId, name, text);
            document.getElementById('commentName').value = '';
            document.getElementById('commentText').value = '';
            btn.disabled = false;
            btn.textContent = 'post comment';
            await loadComments(postId);
        }
    </script>
</body>
</html>
