    <script src="script.js"></script>
    <script>
        const videoObserver = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.play();
                } else {
                    e.target.pause();
                }
            });
        }, { threshold: 0.25 });

        document.querySelectorAll('video[data-lazy-video]').forEach(v => videoObserver.observe(v));
    </script>
    <script>
        function addMediaToGrid(url, mimeType) {
            const grid = document.querySelector('.photo-grid');
            let el;
            if (mimeType && mimeType.startsWith('video/')) {
                el = document.createElement('video');
                el.loop = true;
                el.muted = true;
                el.playsInline = true;
                el.preload = 'none';
                const src = document.createElement('source');
                src.src = url;
                src.type = 'video/mp4';
                el.appendChild(src);
                grid.appendChild(el);
                videoObserver.observe(el);
            } else {
                el = document.createElement('img');
                el.src = url;
                el.alt = 'Photography';
                el.loading = 'lazy';
                grid.appendChild(el);
            }
        }

        // Load gallery photos added via the local admin tool
        fetch('data/photos.json').then(r => r.json()).then(photos => {
            photos.forEach(p => addMediaToGrid(p.url, p.url.match(/\.(mov|mp4|webm)$/i) ? 'video/mp4' : 'image/jpeg'));
        }).catch(() => {});
    </script>
