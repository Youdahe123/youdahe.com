<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="/thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">home</a>
            <a href="writing.html">writing</a>
            <a href="photography.html">photography</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <main class="container writing-container">
        <article id="postContent">
            <p class="writing-loading">Loading...</p>
        </article>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="posts.js"></script>
    <script>
        const id = new URLSearchParams(window.location.search).get('id');
        const container = document.getElementById('postContent');

        if (!id) {
            window.location.href = 'writing.html';
        } else {
            const post = getPost(id);

            if (!post) {
                container.innerHTML = '<p>Post not found.</p><a href="writing.html" class="post-back">back to writing</a>';
            } else {
                document.title = `${post.title} · youdahe.com`;
                const paragraphs = post.content.split('\n').filter(l => l.trim()).map(l => `<p>${l}</p>`).join('');

                container.innerHTML = `
                    <a href="writing.html" class="post-back">back</a>
                    <span class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                    <h1 class="post-full-title">${post.title}</h1>
                    <div class="post-body">${paragraphs}</div>
                `;
            }
        }
    </script>
</body>
</html>
