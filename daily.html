<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daily log · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="/thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">home</a>
            <a href="writing.html">writing</a>
            <a href="photography.html">photography</a>
            <a href="daily.html">daily log</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <!-- password gate -->
    <div id="gate" class="admin-gate">
        <div class="daily-gate-inner">
            <input type="password" id="passwordInput" class="admin-password" placeholder="password" autofocus>
            <p id="gateError" class="daily-gate-error"></p>
        </div>
    </div>

    <!-- main content -->
    <main class="container writing-container" id="logFeed" style="display:none;">
        <section>
            <h1 class="writing-title">Daily Log</h1>
            <p class="writing-subtitle">Summer 2026</p>

            <!-- NeetCode progress -->
            <div class="nc-widget">
                <div class="nc-header">
                    <span class="nc-label">NeetCode 150</span>
                    <span class="nc-count" id="ncCount">—</span>
                </div>
                <div class="nc-bar-track">
                    <div class="nc-bar-fill" id="ncFill" style="width:0%"></div>
                </div>
            </div>

            <!-- Calendar -->
            <div class="cal-wrap">
                <div class="cal-nav">
                    <button class="cal-nav-btn" onclick="changeMonth(-1)">←</button>
                    <span class="cal-month-label" id="calLabel"></span>
                    <button class="cal-nav-btn" onclick="changeMonth(1)">→</button>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="cal-panel" id="calPanel"></div>
            </div>
        </section>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="daily.js"></script>
    <script>
        // sections — NeetCode handled automatically from GitHub
        const SECTIONS = [
            { key: 'libertyMutual',    label: 'Liberty Mutual',   logo: '/logos/libertymutual.png' },
            { key: 'medica',           label: 'Medica',            logo: '/logos/medica.png' },
            { key: 'youdaheDB',        label: 'youdaheDB',        logo: null },
            { key: 'containerRuntime', label: 'container-runtime', logo: null },
            { key: 'sysDesign',        label: 'Sys Design',        logo: null },
            { key: 'startup',          label: 'Startup',           logo: null },
            { key: 'wins',             label: 'Wins',              logo: null },
            { key: 'blockers',         label: 'Blockers',          logo: null },
        ];

        const MONTHS   = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const NC_REPO  = 'Youdahe123/neetcode-submissions1';

        let allLogs   = [];
        let dateMap   = {};   // date key -> daily log
        let ncDateMap = {};   // date key -> [commit shas]
        let ncCache   = {};   // date key -> [{slug, code}]
        let calYear   = new Date().getFullYear();
        let calMonth  = new Date().getMonth();
        let selected  = null;

        // ── auth ─────────────────────────────────────────────────────────────

        async function unlock(password) {
            const err = document.getElementById('gateError');
            err.textContent = '';
            const logs = await getDailyLogs(password);
            if (logs === null) { err.textContent = 'wrong password'; return; }
            sessionStorage.setItem('daily_pw', password);
            showFeed(logs);
        }

        function showFeed(logs) {
            allLogs = logs;
            dateMap = buildDateMap(logs);
            document.getElementById('gate').style.display    = 'none';
            document.getElementById('logFeed').style.display = 'block';
            renderCalendar();
            loadNeetcodeProgress();
            loadNeetcodeCommits(); // re-renders calendar with NC dots when done
        }

        document.getElementById('passwordInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') unlock(e.target.value);
        });

        const saved = sessionStorage.getItem('daily_pw');
        if (saved) getDailyLogs(saved).then(logs => { if (Array.isArray(logs)) showFeed(logs); });

        // ── helpers ───────────────────────────────────────────────────────────

        function buildDateMap(logs) {
            const map = {};
            for (const log of logs) map[toKey(new Date(log.date))] = log;
            return map;
        }

        function toKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function slugToTitle(slug) {
            return slug.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
        }

        function escapeHtml(s) {
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // ── NeetCode progress (tree API — total unique folders) ───────────────

        async function loadNeetcodeProgress() {
            const TOTAL = 150;
            try {
                const res  = await fetch(`https://api.github.com/repos/${NC_REPO}/git/trees/HEAD?recursive=1`);
                const data = await res.json();
                const folders = new Set();
                for (const item of data.tree || []) {
                    const m = item.path.match(/^Data Structures & Algorithms\/([^/]+)\//);
                    if (m) folders.add(m[1]);
                }
                const done = folders.size;
                const pct  = Math.round((done / TOTAL) * 100);
                document.getElementById('ncCount').textContent = `${done} / ${TOTAL}`;
                document.getElementById('ncFill').style.width  = `${pct}%`;
            } catch {
                document.getElementById('ncCount').textContent = 'unavailable';
            }
        }

        // ── NeetCode commit dates (commits API — which days had submissions) ──

        async function loadNeetcodeCommits() {
            try {
                const res     = await fetch(`https://api.github.com/repos/${NC_REPO}/commits?per_page=100`);
                const commits = await res.json();
                ncDateMap = {};
                for (const c of commits) {
                    const msg = c.commit?.message || '';
                    if (msg.startsWith('Initialize') || msg.startsWith('Bulk sync')) continue;
                    const key = c.commit.author.date.slice(0, 10);
                    (ncDateMap[key] = ncDateMap[key] || []).push(c.sha);
                }
            } catch {}
            renderCalendar(); // update dots with NC data
        }

        // ── Lazy-load submissions for a specific day ──────────────────────────

        async function fetchNeetcodeForDay(dateKey) {
            if (ncCache[dateKey]) return ncCache[dateKey];

            const shas = ncDateMap[dateKey] || [];
            if (!shas.length) return [];

            // gather unique problem slugs + latest submission path per slug
            const problemMap = new Map(); // slug -> [{n, path}]
            for (const sha of shas) {
                try {
                    const res  = await fetch(`https://api.github.com/repos/${NC_REPO}/commits/${sha}`);
                    const data = await res.json();
                    for (const f of data.files || []) {
                        const m = f.filename.match(/^Data Structures & Algorithms\/([^/]+)\/submission-(\d+)\.py$/);
                        if (!m) continue;
                        const [, slug, numStr] = m;
                        if (!problemMap.has(slug)) problemMap.set(slug, []);
                        problemMap.get(slug).push({ n: parseInt(numStr), path: f.filename });
                    }
                } catch {}
            }

            // fetch the latest submission file content for each slug
            const results = [];
            for (const [slug, files] of problemMap) {
                files.sort((a, b) => b.n - a.n);
                const encodedPath = files[0].path.split('/').map(encodeURIComponent).join('/');
                try {
                    const res  = await fetch(`https://api.github.com/repos/${NC_REPO}/contents/${encodedPath}`);
                    const data = await res.json();
                    const code = atob(data.content.replace(/\n/g, ''));
                    results.push({ slug, code });
                } catch {
                    results.push({ slug, code: '# could not load code' });
                }
            }

            ncCache[dateKey] = results;
            return results;
        }

        // ── calendar ──────────────────────────────────────────────────────────

        function renderCalendar() {
            document.getElementById('calLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;

            const todayKey    = toKey(new Date());
            const firstDow    = new Date(calYear, calMonth, 1).getDay();
            const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

            let html = ['Su','Mo','Tu','We','Th','Fr','Sa']
                .map(d => `<div class="cal-dow">${d}</div>`).join('');

            for (let i = 0; i < firstDow; i++) html += `<div class="cal-cell"></div>`;

            for (let day = 1; day <= daysInMonth; day++) {
                const key    = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasLog = !!dateMap[key];
                const hasNc  = !!(ncDateMap[key]?.length);
                const hasAny = hasLog || hasNc;

                const cls = ['cal-cell',
                    hasAny           ? 'has-log'  : '',
                    key === todayKey ? 'is-today'  : '',
                    key === selected ? 'is-sel'    : '',
                ].filter(Boolean).join(' ');

                html += `<div class="${cls}"${hasAny ? ` onclick="selectDay('${key}')"` : ''}>
                    <span class="cal-num">${day}</span>
                    ${hasAny ? '<span class="cal-dot"></span>' : ''}
                </div>`;
            }

            document.getElementById('calGrid').innerHTML = html;
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth < 0)  { calMonth = 11; calYear--; }
            if (calMonth > 11) { calMonth = 0;  calYear++; }
            selected = null;
            document.getElementById('calPanel').innerHTML = '';
            renderCalendar();
        }

        // ── day panel ─────────────────────────────────────────────────────────

        async function selectDay(key) {
            const panel = document.getElementById('calPanel');

            if (selected === key) {
                selected = null;
                panel.innerHTML = '';
                renderCalendar();
                return;
            }

            selected = key;
            renderCalendar();

            const log = dateMap[key];
            const d   = new Date(key + 'T12:00:00');
            const hasNc = !!(ncDateMap[key]?.length);

            // date header
            let html = `
                <div class="cal-panel-date">
                    <span class="cal-panel-day">${d.toLocaleDateString('en-US',{weekday:'long'})}</span>
                    <span class="cal-panel-full">${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</span>
                </div>`;

            // daily log sections
            if (log) {
                const filled = SECTIONS.filter(s => log[s.key]?.trim());
                if (filled.length) {
                    html += `<div class="cal-panel-sections">
                        ${filled.map(s => `
                            <div class="cal-panel-section">
                                <div class="daily-entry-label">
                                    ${s.logo ? `<img src="${s.logo}" class="daily-entry-logo" alt="${s.label}">` : ''}
                                    <span>${s.label}</span>
                                </div>
                                <p class="daily-entry-text">${log[s.key].replace(/\n/g,'<br>')}</p>
                            </div>`).join('')}
                    </div>`;
                }
            }

            // NeetCode placeholder — will be filled in async below
            if (hasNc) {
                html += `<div id="ncDayBlock">
                    <div class="daily-entry-label nc-day-label"><span>NeetCode</span></div>
                    <p class="daily-entry-text nc-loading">loading submissions...</p>
                </div>`;
            }

            panel.innerHTML = html;
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            // async: fill in the NeetCode block
            if (hasNc) {
                const problems = await fetchNeetcodeForDay(key);
                const block = document.getElementById('ncDayBlock');
                if (!block) return; // user navigated away

                if (!problems.length) {
                    block.querySelector('.nc-loading').textContent = 'no submissions found';
                    return;
                }

                block.innerHTML = `
                    <div class="daily-entry-label nc-day-label">
                        <span>NeetCode · ${problems.length} problem${problems.length !== 1 ? 's' : ''}</span>
                    </div>
                    ${problems.map(p => `
                        <div class="nc-problem">
                            <span class="nc-problem-name">${slugToTitle(p.slug)}</span>
                            <pre class="nc-code"><code>${escapeHtml(p.code)}</code></pre>
                        </div>`).join('')}`;
            }
        }
    </script>
</body>
</html>
