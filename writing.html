<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>writing · youdahe.com</title>
    <link rel="icon" type="image/jpeg" href="/thumbnails/757728ea03cf11b495d92a9852a9f060.jpg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-links">
            <a href="index.html">home</a>
            <a href="writing.html">writing</a>
            <a href="photography.html">photography</a>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </nav>

    <main class="container writing-container">
        <section class="writing">
            <h1 class="writing-title">Writing</h1>
            <p class="writing-subtitle">Thoughts on systems, startups, and building things.</p>

            <div class="post-list" id="postList"></div>
        </section>
    </main>

    <div class="footer-bar"></div>

    <script src="script.js"></script>
    <script src="posts.js"></script>
    <script>
        (async () => {
            const posts = await getPosts();
            const container = document.getElementById('postList');

            if (posts.length === 0) {
                container.innerHTML = '<p class="writing-empty">Nothing yet — check back soon.</p>';
            } else {
                container.innerHTML = posts.map(post => `
                    <a href="post.html?id=${post.id}" class="post-item">
                        <span class="post-date">${new Date(post.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                        <h2 class="post-heading">${post.title}</h2>
                        <p class="post-preview">${post.preview}</p>
                    </a>
                `).join('');
            }
        })();
    </script>
</body>
</html>
